name: eco_touchless
description: ECO-TOUCHLESS - Clasificación visual con inteligencia artificial

publish_to: 'none'
version: 1.3.0+7

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Cámara e inferencia (ya las tenías) ---
  camera: ^0.11.2+1
  tflite_flutter: 0.12.1
  image: ^4.9.2

  # --- Persistencia: historial (SQLite) y configuración (SharedPreferences) ---
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

  # --- Gráficos para la pantalla de Estadísticas ---
  fl_chart: ^0.69.2

  # --- Formateo de fechas (historial con fecha/hora exacta) ---
  intl: ^0.19.0
  archive: ^4.0.7
  share_plus: 11.1.0

  # --- Vinculación con la ESP32 (petición HTTP + conexión Wi-Fi al AP) ---
  http: ^1.6.0
  plugin_wifi_connect: ^2.0.1
  permission_handler: ^11.3.1
  app_settings: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Genera el ícono real de la app (el que se ve en el launcher del celular)
  # a partir de assets/icon.png. Se corre una sola vez con:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  # Ícono adaptativo (Android 8+): el logo queda dentro de la zona segura
  # sobre fondo blanco, así el launcher puede recortarlo en círculo o squircle.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#0B1220"
    theme_color: "#63CDBD"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256
  # Se sube de 21 a 26: plugin_wifi_connect (conexión automática al AP de la
  # ESP32) requiere las APIs modernas de Wi-Fi de Android, que solo están
  # completas desde Android 8 (API 26) en adelante. Con min_sdk 21 la
  # conexión automática fallaría silenciosamente en varios equipos.
  min_sdk_android: 26

flutter:
  uses-material-design: true

  assets:
    - assets/modelos/
    - assets/bench/
    - assets/labels.txt
    - assets/icon.png
    - assets/branding/
